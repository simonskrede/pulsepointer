[package]
name = "pulsepointer"
version = "0.2.0"
edition = "2021"
description = "An audio visualizer that follows the cursor on KDE Plasma."
authors = ["Simon Skrede <5637642+simonskrede@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/simonskrede/pulsepointer"
keywords = ["kde", "kwin", "cursor", "audio", "visualization"]

[dependencies]
libpulse-binding = "2.28"
libpulse-simple-binding = "2.28"
ctrlc = "3.4"
clap = { version = "4.5.53", features = ["derive"] }
rustfft = "6.4.1"

[profile.release]
lto = "thin"
strip = "debuginfo"
