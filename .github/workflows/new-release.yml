name: Release
run-name: Release a new ${{ inputs.bump }} version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: new-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check and tag the new version
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require the main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Run Release on the main branch" >&2
            exit 1
          fi

      - name: Install check dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates cargo git libpulse-dev pkg-config python3 \
            rust-clippy rustfmt

      - name: Check out the selected main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test version updates
        run: python3 -m unittest discover -s tests -p test_release_version.py

      - name: Update the version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version=$(python3 scripts/bump-version.py "$BUMP")
          tag="v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Release tag $tag already exists" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --locked --all-targets -- --deny warnings

      - name: Test Rust
        run: cargo test --locked

      - name: Commit and tag the release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock kwin-effect/CMakeLists.txt \
            README.md docs/distribution-packaging.md
          git commit -m "Release $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"
          printf '## %s\n\nVersion committed and tagged. Package builds and publication follow in this run.\n' \
            "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

  packages:
    name: Build and publish packages
    needs: prepare
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      package_revision: "1"
      publish: true
