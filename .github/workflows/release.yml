name: Build release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z release tag
        required: true
        type: string
      source_ref:
        description: Optional source commit or branch (defaults to release_tag)
        required: false
        type: string
      package_revision:
        description: Package rebuild number
        required: true
        default: "1"
        type: string
      publish:
        description: Upload packages to the GitHub Release
        required: true
        default: false
        type: boolean

jobs:
  build:
    name: Ubuntu ${{ matrix.ubuntu }} / amd64
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["26.04", "26.10"]
    env:
      BASE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.package_revision || '1' }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates cargo cmake extra-cmake-modules git \
            kwin-dev kwin-x11-dev libdrm-dev libkf6globalaccel-dev libkf6kcmutils-dev libpulse-dev \
            ninja-build pkg-config libegl-mesa0 libgles2

      - name: Check out package source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.source_ref || inputs.release_tag) || github.ref }}

      - name: Validate release tag
        shell: bash
        run: |
          expected_tag="v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match Cargo.toml ($expected_tag)" >&2
            exit 1
          fi

      - name: Build distribution packages
        shell: bash
        run: |
          PACKAGE_REVISION="${BASE_REVISION}+ubuntu${{ matrix.ubuntu }}" \
            ./packaging/build-deb.sh

      - name: Test native effects and settings
        run: |
          ctest --test-dir target/package-build/kwin-wayland --output-on-failure --no-tests=error
          ctest --test-dir target/package-build/kwin-x11 --output-on-failure --no-tests=error

      - name: Record package compatibility
        shell: bash
        run: |
          source_commit=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)
          metadata="dist/PACKAGE-METADATA-ubuntu${{ matrix.ubuntu }}-amd64-${BASE_REVISION}.txt"
          {
            echo "PulsePointer tag: $RELEASE_TAG"
            echo "Source commit: $source_commit"
            echo "Ubuntu release: ${{ matrix.ubuntu }}"
            dpkg-query -W -f='Wayland KWin: ${Package} ${Version}\n' libkwin6
            dpkg-query -W -f='X11 KWin: ${Package} ${Version}\n' libkwin-x11-6
            echo
            dpkg-deb --field dist/pulsepointer_*.deb Package Version Architecture Depends
            echo
            dpkg-deb --field dist/pulsepointer-kwin-x11_*.deb Package Version Architecture Depends
          } >"$metadata"

      - name: Generate build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*.deb

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pulsepointer-ubuntu-${{ matrix.ubuntu }}-amd64
          path: |
            dist/*.deb
            dist/PACKAGE-METADATA-*.txt
          if-no-files-found: error

  build-fedora:
    name: Fedora 45 / x86_64
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:45
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      BASE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.package_revision || '1' }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Install packaging tools
        run: dnf install --assumeyes git-core cargo rpm-build dnf5-plugins

      - name: Check out package source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.source_ref || inputs.release_tag) || github.ref }}

      - name: Validate release tag
        shell: bash
        run: |
          expected_tag="v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match Cargo.toml ($expected_tag)" >&2
            exit 1
          fi

      - name: Install build dependencies
        run: dnf builddep --assumeyes packaging/pulsepointer.spec

      - name: Build and test Fedora RPMs
        run: PACKAGE_REVISION="$BASE_REVISION" ./packaging/build-rpm.sh

      - name: Install, inspect, and remove the binary RPM
        run: |
          dnf install --assumeyes ./dist/pulsepointer-*.x86_64.rpm
          rpm -V pulsepointer
          pulsepointer --help
          rpm --erase pulsepointer
          test ! -e /usr/bin/pulsepointer

      - name: Record package compatibility
        shell: bash
        run: |
          source_commit=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)
          {
            echo "PulsePointer tag: $RELEASE_TAG"
            echo "Source commit: $source_commit"
            echo "Fedora release: 45"
            echo "Session: Plasma Wayland"
            rpm -q kwin-libs
            rpm -qp --info dist/pulsepointer-*.x86_64.rpm
            rpm -qp --requires dist/pulsepointer-*.x86_64.rpm
          } >"dist/PACKAGE-METADATA-fedora45-x86_64-${BASE_REVISION}.txt"

      - name: Generate build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*.rpm

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pulsepointer-fedora-45-x86_64
          path: |
            dist/*.rpm
            dist/PACKAGE-METADATA-*.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release assets
    if: github.event_name == 'push' || inputs.publish
    needs: [build, build-fedora]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      BASE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.package_revision || '1' }}
    steps:
      - name: Check out release notes
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.source_ref || inputs.release_tag) || github.ref }}

      - name: Download package artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: pulsepointer-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum ./*.deb ./*.rpm >"SHA256SUMS-${BASE_REVISION}"

      - name: Create release or upload new package revision
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}"
          else
            awk -v heading="## [${RELEASE_TAG#v}]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md >release-notes.md
            if [[ ! -s release-notes.md ]]; then
              echo "No changelog entry found for $RELEASE_TAG" >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --notes-file release-notes.md --title "PulsePointer ${RELEASE_TAG#v}"
          fi
