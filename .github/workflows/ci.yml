name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu ${{ matrix.ubuntu }} / Plasma 6
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['26.04', '26.10']
    container: ubuntu:${{ matrix.ubuntu }}
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates cargo cmake extra-cmake-modules \
            kwin-dev kwin-x11-dev libdrm-dev libkf6globalaccel-dev libkf6kcmutils-dev libpulse-dev ninja-build pkg-config \
            libegl-mesa0 libgles2 rust-clippy rustfmt

      - name: Check out source
        uses: actions/checkout@v6

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --locked --all-targets -- --deny warnings

      - name: Test Rust
        run: cargo test --locked

      - name: Build Wayland and X11 packages
        run: ./packaging/build-deb.sh

      - name: Test cursor, settings, audio motion, and screen shaders
        run: |
          ctest --test-dir target/package-build/kwin-wayland --output-on-failure --no-tests=error
          ctest --test-dir target/package-build/kwin-x11 --output-on-failure --no-tests=error

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: pulsepointer-ci-ubuntu-${{ matrix.ubuntu }}-amd64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  fedora:
    name: Fedora 45 / Plasma Wayland
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:45
    steps:
      - name: Install packaging tools
        run: dnf install --assumeyes git-core cargo rpm-build dnf5-plugins rustfmt clippy

      - name: Check out source
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: dnf builddep --assumeyes packaging/pulsepointer.spec

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --locked --all-targets -- --deny warnings

      - name: Build and test Fedora RPMs
        run: ./packaging/build-rpm.sh

      - name: Install, inspect, and remove the binary RPM
        run: |
          dnf install --assumeyes ./dist/pulsepointer-*.x86_64.rpm
          rpm -q --requires pulsepointer
          rpm -V pulsepointer
          pulsepointer --help
          rpm --erase pulsepointer
          test ! -e /usr/bin/pulsepointer

      - name: Upload test packages
        uses: actions/upload-artifact@v4
        with:
          name: pulsepointer-ci-fedora-45-x86_64
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 7
